version: 2

models:
  - name: dim_data
    description: Calendário da Adventure Works, uma linha por dia com data de pedido. Derivada de stg_sales_salesorderheader.
    columns:
      - name: pk_data
        description: Chave primária da data, no formato date.
        data_tests:
          - unique
          - not_null
      - name: data_pedido
        description: Data completa do calendário.
      - name: ano
        description: Ano da data.
      - name: mes
        description: Mês da data (número de 1 a 12).
      - name: ano_mes
        description: Ano e mês no formato yyyy-MM, usado para agrupar vendas mensais.